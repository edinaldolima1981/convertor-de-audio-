<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d22" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with elegant dark gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="4" />

  <!-- Waveform lines with gradient and neon glow -->
  <g transform="translate(0, 8)" filter="url(#glow)">
    <!-- Wave 1 -->
    <rect x="110" y="220" width="16" height="72" rx="8" fill="url(#accent-grad)" opacity="0.3" />
    <!-- Wave 2 -->
    <rect x="146" y="180" width="16" height="152" rx="8" fill="url(#accent-grad)" opacity="0.5" />
    <!-- Wave 3 -->
    <rect x="182" y="130" width="16" height="252" rx="8" fill="url(#accent-grad)" opacity="0.8" />
    <!-- Center Wave with full illumination -->
    <rect x="218" y="90" width="16" height="332" rx="8" fill="url(#accent-grad)" />
    <!-- Extractions marker wave -->
    <rect x="254" y="160" width="16" height="192" rx="8" fill="url(#accent-grad)" />
    <!-- Wave 5 -->
    <rect x="290" y="110" width="16" height="292" rx="8" fill="#10b981" />
    <!-- Wave 6 -->
    <rect x="326" y="190" width="16" height="132" rx="8" fill="#10b981" opacity="0.8" />
    <!-- Wave 7 -->
    <rect x="362" y="230" width="16" height="52" rx="8" fill="#10b981" opacity="0.4" />
  </g>

  <!-- Arrow pointing down representing audio extraction -->
  <path d="M 236 180 L 276 180 L 276 250 L 316 250 L 256 310 L 196 250 L 236 250 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
